<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kasm2 · control-center</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="status">
  <span id="status-state">spawning…</span>
  <span class="sep">·</span>

  <span class="slot-picker-wrap" title="Pool slot — click to switch (like an XFCE workspace)">
    <span class="slot-label">slot</span>
    <span id="slot-picker"></span>
  </span>
  <span class="sep">·</span>

  <span class="url-input-wrap">
    <span class="url-input-label">?url=</span>
    <input id="url-input" type="text" spellcheck="false" autocomplete="off"
           autocorrect="off" autocapitalize="off"
           placeholder="(empty — type a URL and press Enter)"
           title="Edit the value of the ?url= query param. Press Enter to apply; the in-container hook opens it.">
  </span>
  <button id="reset-btn" type="button" title="Clear all URL params (keeps desktop and slot)">reset</button>
  <span class="sep">·</span>

  <button id="params-btn" type="button" title="Show current passthrough params" aria-expanded="false">params (0)</button>
  <span class="sep">·</span>

  <span id="sync-badge" class="sync-badge sync-idle" title="never synced" aria-label="sync status">●</span>
  <span id="status-error"></span>
</div>

<div id="params-popup" hidden role="dialog" aria-label="Current params">
  <div class="params-popup-head">params bag</div>
  <pre id="params-popup-body">{}</pre>
</div>

<div id="viewport">
  <div id="placeholder">Waiting for kasm viewer…</div>
  <!--
    sandbox: drop allow-clipboard-write (non-standard token; the standard
    delegation is via the `allow=` Permissions Policy below). Keep the rest.
    allow: Permissions Policy delegated to the iframe. clipboard-read needs
    a secure context (https/localhost) to fire navigator.clipboard.readText
    inside the viewer — without it KasmVNC falls back to its sidebar
    clipboard widget, which still works over plain http.
  -->
  <iframe id="viewer" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-pointer-lock" allow="clipboard-read; clipboard-write; fullscreen" style="display:none" referrerpolicy="no-referrer"></iframe>
</div>

<script src="/static/app.js"></script>
</body>
</html>
